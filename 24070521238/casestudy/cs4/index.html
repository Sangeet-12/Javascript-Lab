<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Card PIN Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            border: 1px solid #ddd;
        }
        h2 {
            margin-top: 0;
            color: #1a365d;
            font-size: 22px;
            text-align: center;
        }
        .prn-text {
            font-size: 16px;
            font-weight: 600;
            color: #4a5568;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            letter-spacing: 2px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2c5282;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .success {
            background-color: #e6fffa;
            border: 1px solid #b2f5ea;
            color: #234e52;
        }
        .normal {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            color: #2b6cb0;
        }
        .error {
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ATM PIN Verification System</h2>
    <div class="prn-text">PRN:24070521238</div>

    <form onsubmit="event.preventDefault(); verifyPIN();">
        <div class="form-group">
            <label for="pinInput">Enter ATM PIN:</label>
            <input type="text" id="pinInput" placeholder="e.g. 1221 or 4589" maxlength="6" autocomplete="off">
        </div>

        <button type="submit">Verify PIN</button>
    </form>

    <div id="result" class="result"></div>
</div>

<script>
    // ====================================================
    // DEMONSTRATION OF JAVASCRIPT CONCEPTS (COLLEGE ASSIGNMENT)
    // ====================================================

    // 1. GLOBAL SCOPE VARIABLE
    // Accessible everywhere in the script
    const BANK_NAME = "Secure ATM Network";

    // 2. CLOSURE CONCEPT
    // Outer function returns inner function that retains access to 'attempts'
    function createAttemptTracker() {
        let attempts = 0; // Lexical environment variable (Closure state)
        return function() {
            attempts++;
            return attempts;
        };
    }
    // Instantiate closure
    const getAttemptCount = createAttemptTracker();

    // 3. FUNCTION DECLARATION
    // Standard function declaration to reverse entered PIN
    function reversePIN(pin) {
        let strPin = String(pin);
        let reversed = ""; // Local Function Scope variable
        for (let i = strPin.length - 1; i >= 0; i--) {
            reversed += strPin[i];
        }
        return reversed;
    }

    // 4. FUNCTION EXPRESSION
    // Function expression stored in a variable to check palindrome
    const checkPalindrome = function(pin) {
        let strPin = String(pin);
        let reversedPin = reversePIN(strPin); // Calls function declaration
        return strPin === reversedPin;
    };

    // 5. ARROW FUNCTION
    // Arrow function to generate security message based on palindrome status
    const getSecurityMessage = (isPalin) => {
        if (isPalin) {
            return "PIN ACCEPTED: Palindromic PIN Verified! Special security message activated.";
        } else {
            return "WRONG PIN: Access Denied! Entered PIN is not a palindrome.";
        }
    };

    // Main verification function
    function verifyPIN() {
        // FUNCTION SCOPE VARIABLES
        let pin = document.getElementById("pinInput").value.trim();
        let resultDiv = document.getElementById("result");

        // Strict numeric input validation (digits only)
        if (pin === "" || !/^\d+$/.test(pin)) {
            resultDiv.className = "result error";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "Please enter a valid numeric PIN (digits only).";
            return;
        }

        // Call closure to get total attempt count
        let totalAttempts = getAttemptCount();

        // Perform palindrome check using Function Expression
        let isPalin = checkPalindrome(pin);

        // Get security message using Arrow Function
        let message = getSecurityMessage(isPalin);

        // BLOCK SCOPE VARIABLE inside if/else block
        if (isPalin) {
            let securityCode = "SEC-PAL-" + Math.floor(1000 + Math.random() * 9000); // Block scoped with let
            resultDiv.className = "result success";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <strong>${message}</strong><br><br>
                <strong>Entered PIN:</strong> ${pin}<br>
                <strong>Reversed PIN:</strong> ${reversePIN(pin)}<br>
                <strong>Security Code:</strong> ${securityCode}<br>
                <strong>Attempt Count (Closure):</strong> ${totalAttempts}<br>
                <small style="color: #666;">Verified by ${BANK_NAME} (Global Scope)</small>
            `;
        } else {
            resultDiv.className = "result error";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <strong>${message}</strong><br><br>
                <strong>Entered PIN:</strong> ${pin}<br>
                <strong>Reversed PIN:</strong> ${reversePIN(pin)}<br>
                <strong>Attempt Count (Closure):</strong> ${totalAttempts}<br>
                <small style="color: #666;">Verified by ${BANK_NAME} (Global Scope)</small>
            `;
        }
    }
</script>

</body>
</html>
