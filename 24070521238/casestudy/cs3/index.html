<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Category Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        .box {
            width: 380px;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .prn {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            width: 95%;
        }

        #result {
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Scholarship Checker</h2>
        <div class="prn">PRN:24070521238</div>

        <label for="sub1">Subject 1 Marks:</label><br>
        <input type="number" id="sub1" min="0" max="100" placeholder="Marks for Subject 1"><br>

        <label for="sub2">Subject 2 Marks:</label><br>
        <input type="number" id="sub2" min="0" max="100" placeholder="Marks for Subject 2"><br>

        <label for="sub3">Subject 3 Marks:</label><br>
        <input type="number" id="sub3" min="0" max="100" placeholder="Marks for Subject 3"><br>

        <label for="sub4">Subject 4 Marks:</label><br>
        <input type="number" id="sub4" min="0" max="100" placeholder="Marks for Subject 4"><br>

        <button onclick="checkScholarship()">Calculate Scholarship</button>

        <div id="result"></div>
    </div>

    <script>
        function checkScholarship() {
            let m1 = parseFloat(document.getElementById("sub1").value);
            let m2 = parseFloat(document.getElementById("sub2").value);
            let m3 = parseFloat(document.getElementById("sub3").value);
            let m4 = parseFloat(document.getElementById("sub4").value);

            let resultDiv = document.getElementById("result");

            if (isNaN(m1) || isNaN(m2) || isNaN(m3) || isNaN(m4) ||
                m1 < 0 || m1 > 100 || m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100 || m4 < 0 || m4 > 100) {
                resultDiv.innerHTML = "<span style='color:red;'>Please enter valid marks (0-100) for all 4 subjects.</span>";
                return;
            }

            let total = m1 + m2 + m3 + m4;
            let avg = total / 4;
            let category = "";

            if (avg < 50) {
                category = "Not Eligible";
            } else if (avg >= 50 && avg <= 69) {
                category = "Bronze Scholarship";
            } else if (avg >= 70 && avg <= 84) {
                category = "Silver Scholarship";
            } else if (avg >= 85 && avg <= 94) {
                category = "Gold Scholarship";
            } else if (avg >= 95 && avg <= 100) {
                category = "Platinum Scholarship";
            }

            resultDiv.innerHTML = "<b>Average Marks:</b> " + avg.toFixed(2) + "%<br>" +
                "<b>Category:</b> " + category;
        }
    </script>

</body>

</html>
