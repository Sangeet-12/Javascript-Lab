<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping & Bill Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 22px;
        }

        .prn-badge {
            font-size: 16px;
            font-weight: bold;
            background-color: #34495e;
            padding: 6px 12px;
            border-radius: 4px;
            color: #ecf0f1;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        section {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        .product-info p {
            font-size: 14px;
            font-weight: bold;
        }

        .product-info span {
            font-size: 12px;
            color: #666;
        }

        .quantity-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #219150;
        }

        .bill-summary {
            margin-top: 10px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .bill-total {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>GadgetHub Store</h1>
        <div class="prn-badge">PRN:24070521238</div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Product Selection Section -->
        <section>
            <h2>Select Products</h2>
            <form id="shopForm">
                <article class="product-item">
                    <div class="product-info">
                        <p>Wireless Headphones</p>
                        <span>Price: &#8377;1,500</span>
                    </div>
                    <input type="number" id="p1" class="quantity-input" min="0" value="0">
                </article>

                <article class="product-item">
                    <div class="product-info">
                        <p>Smart Watch</p>
                        <span>Price: &#8377;2,500</span>
                    </div>
                    <input type="number" id="p2" class="quantity-input" min="0" value="0">
                </article>

                <article class="product-item">
                    <div class="product-info">
                        <p>Gaming Mouse</p>
                        <span>Price: &#8377;800</span>
                    </div>
                    <input type="number" id="p3" class="quantity-input" min="0" value="0">
                </article>

                <article class="product-item">
                    <div class="product-info">
                        <p>Mechanical Keyboard</p>
                        <span>Price: &#8377;3,000</span>
                    </div>
                    <input type="number" id="p4" class="quantity-input" min="0" value="0">
                </article>

                <button type="button" onclick="calculateBill()">Calculate Total Bill</button>
            </form>
        </section>

        <!-- Bill Calculation Summary -->
        <section>
            <h2>Order Summary</h2>
            <div class="bill-summary" id="billResult">
                <p style="color: #888; font-size: 14px;">Select items and click calculate to view bill.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Online Shopping Website Assignment</p>
    </footer>

    <!-- JavaScript logic -->
    <script>
        function calculateBill() {
            // Prices of products
            const price1 = 1500;
            const price2 = 2500;
            const price3 = 800;
            const price4 = 3000;

            // Quantities
            const q1 = parseInt(document.getElementById('p1').value) || 0;
            const q2 = parseInt(document.getElementById('p2').value) || 0;
            const q3 = parseInt(document.getElementById('p3').value) || 0;
            const q4 = parseInt(document.getElementById('p4').value) || 0;

            const subtotal = (q1 * price1) + (q2 * price2) + (q3 * price3) + (q4 * price4);

            if (subtotal === 0) {
                document.getElementById('billResult').innerHTML = '<p style="color: red; font-size: 14px;">Please enter quantity for at least one item.</p>';
                return;
            }

            // GST Tax @ 18%
            const gst = subtotal * 0.18;
            const totalBill = subtotal + gst;

            let summaryHTML = '';
            if (q1 > 0) summaryHTML += `<div class="bill-row"><span>Wireless Headphones (${q1}):</span> <span>&#8377;${q1 * price1}</span></div>`;
            if (q2 > 0) summaryHTML += `<div class="bill-row"><span>Smart Watch (${q2}):</span> <span>&#8377;${q2 * price2}</span></div>`;
            if (q3 > 0) summaryHTML += `<div class="bill-row"><span>Gaming Mouse (${q3}):</span> <span>&#8377;${q3 * price3}</span></div>`;
            if (q4 > 0) summaryHTML += `<div class="bill-row"><span>Mechanical Keyboard (${q4}):</span> <span>&#8377;${q4 * price4}</span></div>`;

            summaryHTML += `<hr style="margin: 8px 0; border: none; border-top: 1px solid #eee;">`;
            summaryHTML += `<div class="bill-row"><span>Subtotal:</span> <span>&#8377;${subtotal.toFixed(2)}</span></div>`;
            summaryHTML += `<div class="bill-row"><span>GST (18%):</span> <span>&#8377;${gst.toFixed(2)}</span></div>`;
            summaryHTML += `<div class="bill-total"><span>Total Bill:</span> <span>&#8377;${totalBill.toFixed(2)}</span></div>`;

            document.getElementById('billResult').innerHTML = summaryHTML;
        }
    </script>
</body>
</html>
