<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 550px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
        }
        .prn {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input {
            padding: 6px;
            width: 200px;
        }
        button {
            padding: 6px 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #e0e0e0;
        }
        .summary {
            margin-top: 15px;
            padding: 10px;
            background: #eef;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Grading System</h2>
    <div class="prn">PRN: 24070521238</div>

    <form id="gradeForm" onsubmit="return addSubject(event)">
        <div class="form-group">
            <label for="subject">Subject Name:</label>
            <input type="text" id="subject" placeholder="Enter subject name">
        </div>
        <div class="form-group">
            <label for="marks">Marks (0-100):</label>
            <input type="number" id="marks" placeholder="Enter marks">
        </div>
        <button type="submit">Add Subject</button>
        <div id="errorMsg" class="error"></div>
    </form>

    <h3>Subject Results</h3>
    <table>
        <thead>
            <tr>
                <th>Sr No.</th>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="subjectTable">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>

    <div class="summary" id="summaryBox" style="display: none;">
        <p><strong>Total Subjects:</strong> <span id="totalSubjects">0</span></p>
        <p><strong>Total Marks:</strong> <span id="totalMarks">0</span></p>
        <p><strong>Percentage:</strong> <span id="percentage">0</span>%</p>
        <p><strong>Overall Grade:</strong> <span id="overallGrade">-</span></p>
        <p><strong>Final Result:</strong> <span id="finalResult">-</span></p>
    </div>
</div>

<script>
    let subjectsList = [];

    // Function to calculate grade using control structures (if-else)
    function getGrade(marks) {
        if (marks >= 90) return 'A+';
        else if (marks >= 80) return 'A';
        else if (marks >= 70) return 'B';
        else if (marks >= 60) return 'C';
        else if (marks >= 50) return 'D';
        else if (marks >= 40) return 'E';
        else return 'F';
    }

    // Form Validation and Add Subject
    function addSubject(event) {
        event.preventDefault();

        const subjectInput = document.getElementById('subject');
        const marksInput = document.getElementById('marks');
        const errorMsg = document.getElementById('errorMsg');

        const subjectName = subjectInput.value.trim();
        const marksVal = marksInput.value.trim();
        const marks = parseFloat(marksVal);

        // Control structure: Form Validation
        if (subjectName === '') {
            errorMsg.innerText = 'Please enter a valid subject name.';
            return false;
        }

        if (marksVal === '' || isNaN(marks) || marks < 0 || marks > 100) {
            errorMsg.innerText = 'Marks must be a valid number between 0 and 100.';
            return false;
        }

        // Clear error message
        errorMsg.innerText = '';

        // Calculate Grade and Status
        const grade = getGrade(marks);
        const status = marks >= 40 ? 'Pass' : 'Fail';

        // Add subject object to array
        subjectsList.push({
            name: subjectName,
            marks: marks,
            grade: grade,
            status: status
        });

        // Clear input fields
        subjectInput.value = '';
        marksInput.value = '';

        // Update the display table and summary
        updateDisplay();
    }

    // Control structure: Loop to compute results and render table
    function updateDisplay() {
        const tableBody = document.getElementById('subjectTable');
        tableBody.innerHTML = '';

        let totalMarks = 0;
        let hasFailed = false;

        // Loop through subjects list
        for (let i = 0; i < subjectsList.length; i++) {
            const sub = subjectsList[i];
            totalMarks += sub.marks;

            if (sub.status === 'Fail') {
                hasFailed = true;
            }

            const row = `<tr>
                <td>${i + 1}</td>
                <td>${sub.name}</td>
                <td>${sub.marks}</td>
                <td>${sub.grade}</td>
                <td style="color: ${sub.status === 'Pass' ? 'green' : 'red'}; font-weight: bold;">${sub.status}</td>
            </tr>`;

            tableBody.innerHTML += row;
        }

        // Display summary section
        const summaryBox = document.getElementById('summaryBox');
        if (subjectsList.length > 0) {
            summaryBox.style.display = 'block';

            const count = subjectsList.length;
            const percentage = totalMarks / count;
            const overallGrade = getGrade(percentage);

            document.getElementById('totalSubjects').innerText = count;
            document.getElementById('totalMarks').innerText = totalMarks + ' / ' + (count * 100);
            document.getElementById('percentage').innerText = percentage.toFixed(2);
            document.getElementById('overallGrade').innerText = overallGrade;

            const finalResultElem = document.getElementById('finalResult');
            if (hasFailed) {
                finalResultElem.innerText = 'FAIL';
                finalResultElem.style.color = 'red';
            } else {
                finalResultElem.innerText = 'PASS';
                finalResultElem.style.color = 'green';
            }
        }
    }
</script>

</body>
</html>
